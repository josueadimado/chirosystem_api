upstream django_api {
    server api:8000;
}

upstream voice_ws {
    server voice-ws:8001;
}

upstream realtime_ws {
    server realtime-relay:8002;
}

server {
    listen 80;
    server_name api.reliefchiropractic.net;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name api.reliefchiropractic.net;

    ssl_certificate /etc/ssl/certs/cert.pem;
    ssl_certificate_key /etc/ssl/private/key.pem;

    # OpenAI Realtime Media Streams (primary voice AI path)
    location /ws/realtime {
        proxy_pass http://realtime_ws;
        proxy_http_version 1.1;

        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_connect_timeout 10s;

        proxy_buffering off;
        keepalive_timeout 3600s;
    }

    # ConversationRelay WebSocket (legacy fallback)
    location /ws/voice {
        proxy_pass http://voice_ws;
        proxy_http_version 1.1;

        # WebSocket upgrade headers
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Long timeouts for voice calls (default 60s would drop calls)
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_connect_timeout 10s;

        # Keep connection alive
        proxy_buffering off;
        keepalive_timeout 3600s;
    }

    # Health check (no auth needed)
    location = /health {
        proxy_pass http://django_api;
        proxy_set_header Host $host;
    }

    # All other API routes
    location / {
        proxy_pass http://django_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Standard timeouts for API
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
        proxy_connect_timeout 10s;

        client_max_body_size 50M;
    }
}
